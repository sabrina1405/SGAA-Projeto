[tool.poetry]
name = "api"
version = "0.1.0"
description = ""
authors = ["sabrina1405 <sabrina.s.souzarosa@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.142.1"
uvicorn = {extras = ["standard"], version = "^0.54.0"}
sqlalchemy = "^2.1.1"
psycopg = {extras = ["binary"], version = "^3.3.6"}
alembic = "^1.20.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.10,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
