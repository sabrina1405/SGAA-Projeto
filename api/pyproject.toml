[tool.poetry]
name = "api"
version = "0.1.0"
description = ""
authors = ["sabrina1405 <sabrina.s.souzarosa@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "0.142.2"
uvicorn = {extras = ["standard"], version = "0.54.0"}
sqlalchemy = "2.1.3"
psycopg = {extras = ["binary"], version = "3.3.6"}
alembic = "1.20.0"
pyjwt = "2.15.1"
argon2-cffi = "25.1.0"
pydantic-settings = "2.15.0"
email-validator = "2.3.0"
pydantic = "2.13.5"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (==0.16.10)",
    "pytest (==9.1.1)",
    "httpx (==0.28.1)"
]
